appId: com.firelife.desktop
productName: Fire Life
copyright: Copyright © 2026 Fire Life contributors

directories:
  output: release
  buildResources: assets

files:
  - electron/**
  - build/next-standalone/**
  - build/demo.db
  - package.json
  - "!node_modules/**"

asar: false
npmRebuild: false
afterPack: scripts/after-pack.cjs
artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.finance
  icon: assets/icon.png
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: Fire Life

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fire Life
